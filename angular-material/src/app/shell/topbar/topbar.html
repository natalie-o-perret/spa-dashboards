<mat-toolbar class="topbar" role="banner">
  <div class="topbar-start">
    <button
      mat-icon-button
      class="menu-button"
      type="button"
      aria-label="Open navigation"
      matTooltip="Open navigation"
      aria-controls="mobile-navigation"
      [attr.aria-expanded]="drawerOpen()"
      (click)="openNavigation.emit()"
    >
      <mat-icon>menu</mat-icon>
    </button>
    <a mat-button class="comparison-link" href="../" matTooltip="Compare all four dashboards">
      <mat-icon aria-hidden="true">arrow_back</mat-icon>All dashboards
    </a>
    <span class="framework-badge" matTooltip="Built with Angular and Material"
      ><mat-icon aria-hidden="true">auto_awesome</mat-icon>Angular + Material</span
    >
  </div>

  <div class="topbar-actions">
    <span class="sync-status"><i aria-hidden="true"></i> Last synced 8 min ago</span>
    <a
      mat-icon-button
      href="https://github.com/natalie-o-perret/spa-dashboards/tree/main/angular-material"
      target="_blank"
      rel="noreferrer"
      aria-label="View Angular Material source on GitHub"
      matTooltip="View source on GitHub"
    >
      <svg class="github-icon" viewBox="0 0 24 24" aria-hidden="true">
        <path
          d="M12 .7a11.5 11.5 0 0 0-3.6 22.4c.6.1.8-.3.8-.6v-2.2c-3.3.7-4-1.4-4-1.4-.6-1.3-1.4-1.7-1.4-1.7-1.1-.8.1-.8.1-.8 1.2.1 1.9 1.3 1.9 1.3 1.1 1.9 2.9 1.3 3.5 1 .1-.8.4-1.3.8-1.6-2.7-.3-5.5-1.3-5.5-5.7 0-1.3.5-2.3 1.2-3.1-.1-.3-.5-1.5.1-3.1 0 0 1-.3 3.2 1.2a11 11 0 0 1 5.8 0C17.1 5.1 18 5.3 18 5.3c.6 1.6.2 2.8.1 3.1.8.8 1.2 1.8 1.2 3.1 0 4.4-2.7 5.4-5.5 5.7.4.4.8 1.1.8 2.2v3.2c0 .3.2.7.8.6A11.5 11.5 0 0 0 12 .7Z"
        />
      </svg>
    </a>
    <button
      mat-icon-button
      type="button"
      data-testid="theme-toggle"
      [attr.aria-label]="themeActionLabel()"
      [matTooltip]="themeActionLabel()"
      (click)="themeChange.emit(nextTheme().value)"
    >
      <mat-icon>{{ currentTheme().icon }}</mat-icon>
    </button>
    <span class="avatar" aria-label="Signed in as Maya Chen" matTooltip="Demo workspace: Maya Chen"
      >MC</span
    >
  </div>
</mat-toolbar>
