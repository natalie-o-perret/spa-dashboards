<div class="sidebar-inner">
  <div class="sidebar-header">
    <a
      class="brand"
      href="#overview"
      aria-label="Meridian dashboard home"
      (click)="navigate.emit()"
    >
      <span class="brand-mark" aria-hidden="true">M</span>
      <span class="brand-copy">
        <strong>Meridian</strong>
        <small>Portfolio operations</small>
      </span>
    </a>
    @if (mobile()) {
      <button
        mat-icon-button
        class="drawer-close"
        type="button"
        aria-label="Close navigation"
        matTooltip="Close navigation"
        (click)="navigate.emit()"
      >
        <mat-icon>close</mat-icon>
      </button>
    }
  </div>

  <nav class="nav-links" aria-label="Dashboard sections">
    <span class="nav-label">Workspace</span>
    @for (item of navItems; track item.label) {
      <a
        mat-button
        class="nav-item"
        [class.active]="item.active"
        [href]="item.href"
        [matTooltip]="'Go to ' + item.label"
        (click)="navigate.emit()"
      >
        <mat-icon aria-hidden="true">{{ item.icon }}</mat-icon>
        <span>{{ item.label }}</span>
      </a>
    }
  </nav>

  <div class="sidebar-spacer"></div>
  <aside class="cycle-note" aria-label="Current portfolio cycle">
    <mat-chip>Cycle 18</mat-chip>
    <strong>Weekly portfolio review</strong>
    <span>Friday, 18 September</span>
  </aside>
</div>
