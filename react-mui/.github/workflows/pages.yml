name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions: {}

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    permissions:
      contents: read
      pages: write
      id-token: write
    uses: natalie-o-perret/.github/.github/workflows/reusable-deploy-node-pages.yml@dd7f69ad0f1c46e31e82c7113e23d7cc23c7caf3
    with:
      artifact-path: dist
