name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions: {}

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      pages: read
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: |
            angular-material/package-lock.json
            react-mui/package-lock.json
            vue-vuetify/package-lock.json
      - name: Set up npm
        run: npm install --global npm@12.0.2
      - name: Build Angular Material
        working-directory: angular-material
        run: npm ci && npm run check && npm run build:pages
      - name: Build React MUI
        working-directory: react-mui
        run: npm ci && npm run check && npm run build:pages
      - name: Build Vue Vuetify
        working-directory: vue-vuetify
        run: npm ci && npm run check && npm run build:pages
      - name: Assemble site
        run: |
          mkdir -p site/angular-material site/react-mui site/vue-vuetify
          cp index.html styles.css site/
          cp -R angular-material/dist/meridian/browser/. site/angular-material/
          cp -R react-mui/dist/. site/react-mui/
          cp -R vue-vuetify/dist/. site/vue-vuetify/
          touch site/.nojekyll
      - name: Configure Pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
